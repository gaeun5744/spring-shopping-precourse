spring.application.name=spring-shopping

spring.datasource.url=jdbc:h2:mem:shopping
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=validate

purgomalum.base-url=https://www.purgomalum.com

jwt.secret=${JWT_SECRET:local-development-secret-key-must-be-at-least-32-bytes}
jwt.expiration-millis=3600000
